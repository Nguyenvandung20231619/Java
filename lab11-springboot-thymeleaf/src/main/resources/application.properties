server.port=8080
spring.application.name=lab11-springboot-thymeleaf

# H2 embedded giúp ứng dụng chạy ngay cả khi MySQL chưa được khởi động.
spring.datasource.url=jdbc:h2:file:./data/lab11db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tự tạo/cập nhật bảng theo các entity khi chạy ứng dụng.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.thymeleaf.cache=false