server.port=8080
spring.application.name=lab11-springboot-thymeleaf

# MySQL profile: chay voi --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/lab11_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
spring.thymeleaf.cache=false
