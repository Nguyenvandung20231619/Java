<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; padding: 50px; }
        .login-box { background: #fff; max-width: 350px; margin: 0 auto; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>ĐĂNG NHẬP</h2>
    <div th:if="${param.error}" class="error">Tên đăng nhập hoặc mật khẩu không đúng!</div>
    <div th:if="${param.logout}" style="color: green; margin-bottom: 10px;">Đã đăng xuất thành công.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Đăng nhập</button>
    </form>
</div>
</body>
</html>
