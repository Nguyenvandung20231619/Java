<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh viên</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        .navbar { background: #333; padding: 10px; color: white; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
        .navbar a { color: white; margin-right: 15px; text-decoration: none; }
        .btn { padding: 6px 12px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
        .btn-danger { background: #dc3545; }
    </style>
</head>
<body>

<!-- Bài 8: Menu hiển thị theo Role -->
<div class="navbar">
    <div>
        <a th:href="@{/students}">Danh Sách Sinh Viên</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/courses}">Quản Lý Khóa Học (ADMIN)</a>
    </div>

    <!-- Bài 5: Hiển thị thông tin người dùng đang đăng nhập -->
    <div sec:authorize="isAuthenticated()">
        Xin chào: <b><span sec:authentication="name"></span></b>
        (<span sec:authentication="principal.authorities"></span>)
        <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 10px;">
            <button type="submit" style="cursor:pointer;">Đăng xuất</button>
        </form>
    </div>
</div>

<h2>DANH SÁCH SINH VIÊN</h2>

<!-- Bài 5: Ẩn/Hiện nút Thêm chỉ dành cho ADMIN -->
<div sec:authorize="hasRole('ADMIN')" style="margin-bottom: 15px;">
    <a th:href="@{/students/create}" class="btn">+ Thêm sinh viên mới (ADMIN Only)</a>
</div>

<table border="1" cellpadding="8" cellspacing="0" width="100%">
    <thead>
        <tr>
            <th>ID</th>
            <th>Mã SV</th>
            <th>Họ và tên</th>
            <th>Thao tác</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.studentCode}"></td>
            <td th:text="${student.fullName}"></td>
            <td>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{/students/delete/{id}(id=${student.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Xóa?')">Xóa</button>
                </form>
                <span sec:authorize="hasRole('USER')">Chỉ xem</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="4">Chưa có sinh viên.</td>
        </tr>
    </tbody>
</table>

</body>
</html>
