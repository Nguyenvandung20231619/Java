<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">
    <ui:define name="content">
        <h2>Danh sách sinh viên</h2>
        <h:messages globalOnly="true" style="color:green" />
        
        <h:form>
            <p>
                Từ khóa tìm kiếm (Tên/Lớp): 
                <h:inputText value="#{sinhVienBean.keyword}" rendered="#{loginBean.loggedIn}" />
                <h:commandButton value="Tìm kiếm" action="#{sinhVienBean.search}" rendered="#{loginBean.loggedIn}" />
                <h:outputText value="Bạn phải đăng nhập để tìm kiếm" rendered="#{!loginBean.loggedIn}" style="color:gray; font-style:italic;" />
            </p>

            <h:dataTable value="#{sinhVienBean.dsSinhVien}" var="sv" border="1" cellpadding="6">
                <h:column><f:facet name="header">ID</f:facet>#{sv.id}</h:column>
                <h:column><f:facet name="header">Mã SV</f:facet>#{sv.maSinhVien}</h:column>
                <h:column><f:facet name="header">Họ tên</f:facet>#{sv.hoTen}</h:column>
                <h:column><f:facet name="header">Email</f:facet>#{sv.email}</h:column>
                <h:column><f:facet name="header">Lớp</f:facet>#{sv.lop}</h:column>
                <h:column>
                    <f:facet name="header">Thao tác</f:facet>
                    <h:panelGroup rendered="#{loginBean.loggedIn}">
                        <h:commandButton value="Sửa" action="#{sinhVienBean.edit(sv)}" />
                        &#160;
                        <h:commandButton value="Xóa" action="#{sinhVienBean.delete(sv.id)}" />
                    </h:panelGroup>
                    <h:outputText value="Cần đăng nhập" rendered="#{!loginBean.loggedIn}" style="color:gray; font-style:italic;" />
                </h:column>
            </h:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
