<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout('Quản lý sinh viên', ~{::section})}"><section><h2>Quản lý sinh viên</h2><a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/students/create}">+ Thêm sinh viên</a><form class="search" method="get" th:action="@{/students}"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo mã hoặc họ tên"><button class="btn" type="submit">Tìm</button></form><table><thead><tr><th>Mã SV</th><th>Họ tên</th><th>Email</th><th>Thao tác</th></tr></thead><tbody><tr th:each="s:${students}"><td th:text="${s.studentCode}"></td><td th:text="${s.fullName}"></td><td th:text="${s.email}"></td><td><a sec:authorize="hasRole('ADMIN')" class="btn btn-warning" th:href="@{'/students/edit/' + ${s.id}}">Sửa</a> <a sec:authorize="hasRole('ADMIN')" class="btn btn-danger" th:href="@{'/students/delete/' + ${s.id}}" onclick="return confirm('Xóa sinh viên này?')">Xóa</a></td></tr><tr th:if="${#lists.isEmpty(students)}"><td colspan="4" class="empty">Không có dữ liệu.</td></tr></tbody></table></section></html>
