<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Thông tin sinh viên', ~{::section})}"><section><h2 th:text="${student.id == null ? 'Thêm sinh viên' : 'Sửa sinh viên'}"></h2><form th:action="@{/students/save}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"><div class="form-group"><label>Mã sinh viên</label><input class="form-control" th:field="*{studentCode}" required><div class="error" th:errors="*{studentCode}"></div></div><div class="form-group"><label>Họ tên</label><input class="form-control" th:field="*{fullName}" required><div class="error" th:errors="*{fullName}"></div></div><div class="form-group"><label>Email</label><input class="form-control" type="email" th:field="*{email}" required><div class="error" th:errors="*{email}"></div></div><button class="btn" type="submit">Lưu</button> <a class="btn btn-secondary" th:href="@{/students}">Hủy</a></form></section></html>
