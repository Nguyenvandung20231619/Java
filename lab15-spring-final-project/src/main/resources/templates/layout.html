<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title}">Quản lý đào tạo</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;color:#212529}.navbar{background:#003b70;padding:15px 5%;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.navbar a{color:#fff;text-decoration:none;margin-right:18px;font-weight:bold}.container{max-width:1100px;margin:30px auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 12px #0001}.btn{display:inline-block;padding:9px 15px;background:#198754;color:#fff;text-decoration:none;border:0;border-radius:5px;cursor:pointer}.btn-secondary{background:#6c757d}.btn-danger{background:#dc3545}.btn-warning{background:#ffc107;color:#212529}.alert{padding:12px;margin-bottom:18px;border-radius:5px}.alert-success{background:#d1e7dd;color:#0f5132}.alert-danger{background:#f8d7da;color:#842029}.form-group{margin-bottom:15px}.form-control{width:100%;padding:9px;box-sizing:border-box;border:1px solid #ced4da;border-radius:4px}.error{color:#dc3545;font-size:.9em}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #dee2e6;padding:11px;text-align:left}th{background:#e9ecef}.search{display:flex;gap:8px;max-width:500px;margin:15px 0}.cards{display:flex;gap:18px;flex-wrap:wrap}.card{flex:1;min-width:180px;padding:22px;color:#fff;border-radius:8px;text-align:center}.empty{padding:20px;text-align:center;color:#6c757d}
</style></head>
<body><nav class="navbar"><div><a th:href="@{/}">Dashboard</a><a th:href="@{/students}">Sinh viên</a><a th:href="@{/courses}">Môn học</a><a th:href="@{/enrollments}">Đăng ký học phần</a></div><div>Xin chào, <b sec:authentication="name"></b> <form th:action="@{/logout}" method="post" style="display:inline"><button class="btn btn-danger" type="submit">Đăng xuất</button></form></div></nav>
<main class="container"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:replace="${content}"></div></main></body></html>
