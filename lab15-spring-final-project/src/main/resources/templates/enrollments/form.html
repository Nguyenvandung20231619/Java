<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Đăng ký học phần', ~{::section})}"><section><h2>Đăng ký học phần</h2><form th:action="@{/enrollments/save}" method="post"><div class="form-group"><label>Sinh viên</label><select name="studentId" class="form-control" required><option value="">-- Chọn sinh viên --</option><option th:each="s:${students}" th:value="${s.id}" th:text="${s.studentCode + ' - ' + s.fullName}"></option></select></div><div class="form-group"><label>Môn học</label><select name="courseId" class="form-control" required><option value="">-- Chọn môn học --</option><option th:each="c:${courses}" th:value="${c.id}" th:text="${c.courseCode + ' - ' + c.courseName}"></option></select></div><button class="btn" type="submit">Đăng ký</button> <a class="btn btn-secondary" th:href="@{/enrollments}">Hủy</a></form></section></html>
