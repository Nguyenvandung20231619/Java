<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout('Danh sách đăng ký', ~{::section})}"><section><h2>Danh sách đăng ký học phần</h2><a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/enrollments/create}">+ Đăng ký mới</a><table><thead><tr><th>Sinh viên</th><th>Môn học</th><th>Ngày đăng ký</th><th>Thao tác</th></tr></thead><tbody><tr th:each="e:${enrollments}"><td th:text="${e.student.studentCode + ' - ' + e.student.fullName}"></td><td th:text="${e.course.courseCode + ' - ' + e.course.courseName}"></td><td th:text="${e.enrollDate}"></td><td><a sec:authorize="hasRole('ADMIN')" class="btn btn-danger" th:href="@{'/enrollments/delete/' + ${e.id}}" onclick="return confirm('Hủy đăng ký này?')">Hủy</a></td></tr><tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="4" class="empty">Chưa có đăng ký nào.</td></tr></tbody></table></section></html>
