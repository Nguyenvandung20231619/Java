<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Thông tin môn học', ~{::section})}"><section><h2 th:text="${course.id == null ? 'Thêm môn học' : 'Sửa môn học'}"></h2><form th:action="@{/courses/save}" th:object="${course}" method="post"><input type="hidden" th:field="*{id}"><div class="form-group"><label>Mã môn học</label><input class="form-control" th:field="*{courseCode}" required><div class="error" th:errors="*{courseCode}"></div></div><div class="form-group"><label>Tên môn học</label><input class="form-control" th:field="*{courseName}" required><div class="error" th:errors="*{courseName}"></div></div><div class="form-group"><label>Số tín chỉ</label><input class="form-control" type="number" min="1" th:field="*{credits}" required><div class="error" th:errors="*{credits}"></div></div><button class="btn" type="submit">Lưu</button> <a class="btn btn-secondary" th:href="@{/courses}">Hủy</a></form></section></html>
