<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout('Quản lý môn học', ~{::section})}"><section><h2>Quản lý môn học</h2><a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/courses/create}">+ Thêm môn học</a><form class="search" method="get" th:action="@{/courses}"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo mã hoặc tên môn"><button class="btn" type="submit">Tìm</button></form><table><thead><tr><th>Mã môn</th><th>Tên môn học</th><th>Tín chỉ</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c:${courses}"><td th:text="${c.courseCode}"></td><td th:text="${c.courseName}"></td><td th:text="${c.credits}"></td><td><a sec:authorize="hasRole('ADMIN')" class="btn btn-warning" th:href="@{'/courses/edit/' + ${c.id}}">Sửa</a> <a sec:authorize="hasRole('ADMIN')" class="btn btn-danger" th:href="@{'/courses/delete/' + ${c.id}}" onclick="return confirm('Xóa môn học này?')">Xóa</a></td></tr><tr th:if="${#lists.isEmpty(courses)}"><td colspan="4" class="empty">Không có dữ liệu.</td></tr></tbody></table></section></html>
