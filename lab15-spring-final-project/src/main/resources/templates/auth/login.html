<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập</title><style>body{font-family:Arial;background:#e9ecef;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:10px;width:350px;box-shadow:0 4px 15px #0002}input,button{box-sizing:border-box;width:100%;padding:11px;margin:8px 0}button{background:#003b70;color:#fff;border:0;border-radius:4px;cursor:pointer}.error{color:#c00;text-align:center}.hint{text-align:center;color:#666;font-size:13px}</style></head><body><div class="box"><h2 style="text-align:center;color:#003b70">ĐĂNG NHẬP</h2><div th:if="${param.error}" class="error">Sai tài khoản hoặc mật khẩu!</div><div th:if="${param.logout}" style="color:green;text-align:center">Đã đăng xuất.</div><form th:action="@{/login}" method="post"><input name="username" placeholder="Tên đăng nhập" required><input type="password" name="password" placeholder="Mật khẩu" required><button type="submit">Đăng nhập</button></form><p class="hint">admin / 123456 (quản trị viên)<br>user / 123456 (người dùng)</p></div></body></html>
