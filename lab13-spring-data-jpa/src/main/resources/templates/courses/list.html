<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách môn học</title>
</head>
<body>
    <h2>Danh sách môn học</h2>

    <form method="get" th:action="@{/courses}">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên môn"/>
        <button type="submit">Tìm</button>
        <a th:href="@{/courses}">Xóa lọc</a>
    </form>

    <a th:href="@{/courses/create}">+ Thêm môn học</a>
    <br/><br/>
    <a th:href="@{/students}">Sang danh sách sinh viên</a>

    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th><th>Mã môn</th><th>Tên môn</th><th>Số tín chỉ</th><th>Thao tác</th>
        </tr>
        <tr th:each="c : ${courses}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.courseCode}"></td>
            <td th:text="${c.courseName}"></td>
            <td th:text="${c.credit}"></td>
            <td>
                <a th:href="@{/courses/edit/{id}(id=${c.id})}">Sửa</a> |
                <a th:href="@{/courses/delete/{id}(id=${c.id})}"
                   onclick="return confirm('Xóa môn học này?');">Xóa</a>
            </td>
        </tr>
    </table>
</body>
</html>
