<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa Sinh Viên' : 'Thêm Sinh Viên'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2 th:text="${isEdit} ? 'Cập Nhật Sinh Viên' : 'Thêm Sinh Viên Mới'"></h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Mã sinh viên:</label>
            <input type="text" th:field="*{studentCode}">
            <span class="error" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></span>
        </div>

        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" th:field="*{fullName}">
            <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Lớp học:</label>
            <input type="text" th:field="*{className}">
            <span class="error" th:if="${#fields.hasErrors('className')}" th:errors="*{className}"></span>
        </div>

        <button type="submit" class="btn">Lưu thông tin</button>
        <a th:href="@{/students}" class="btn btn-secondary">Hủy bỏ</a>
    </form>
</div>
</body>
</html>
